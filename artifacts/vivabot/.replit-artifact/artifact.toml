kind = "web"
previewPath = "/"
title = "VivaBot"
description = "A Django-powered viva practice app for students. The registered web service routes to the existing Django templates and REST API; all application behavior remains in Python, Django, and vanilla JavaScript."
version = "1.0.0"
id = "artifacts/vivabot"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 25608

[services.development]
run = "cd ../.. && python manage.py migrate && python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:$PORT"

[services.production.build]
args = ["python", "manage.py", "collectstatic", "--noinput"]

[services.production.run]
args = ["python", "-m", "gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:25608"]

[services.production.run.env]
PORT = "25608"

[services.env]
PORT = "25608"
BASE_PATH = "/"
